<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1565C0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>💰 บันทึกการเงินส่วนตัว</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ─── Variables ─────────────────────────────── */
    :root {
      --primary:       #1565C0;
      --primary-mid:   #1976D2;
      --primary-light: #E3F2FD;
      --success:       #2E7D32;
      --success-light: #E8F5E9;
      --danger:        #C62828;
      --danger-light:  #FFEBEE;
      --warning:       #E65100;
      --warning-light: #FFF3E0;
      --purple:        #6A1B9A;
      --bg:            #F5F7FA;
      --card:          #FFFFFF;
      --text:          #1A1A2E;
      --text-muted:    #64748B;
      --border:        #E2E8F0;
      --nav-h:         64px;
      --sidebar-w:     224px;
      --radius:        12px;
    }

    /* ─── Reset ──────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', 'Tahoma', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Layout ─────────────────────────────────── */
    .app { display: flex; min-height: 100vh; }

    /* ─── Sidebar ────────────────────────────────── */
    .sidebar {
      display: none;
      width: var(--sidebar-w);
      background: var(--card);
      border-right: 1px solid var(--border);
      position: fixed; top: 0; left: 0; bottom: 0;
      flex-direction: column;
      z-index: 200;
    }
    .sidebar-logo {
      padding: 22px 20px 18px;
      font-size: 18px; font-weight: 700;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .sidebar-nav { flex: 1; padding: 10px 0; overflow-y: auto; }
    .s-item {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 20px;
      cursor: pointer;
      color: var(--text-muted); font-size: 15px;
      border-left: 3px solid transparent;
      transition: background .15s, color .15s;
      border: none; background: none; width: 100%;
      font-family: inherit; font-size: 15px;
      text-align: left;
    }
    .s-item:hover { background: var(--bg); color: var(--text); }
    .s-item.active {
      background: var(--primary-light);
      color: var(--primary);
      border-left: 3px solid var(--primary);
      font-weight: 600;
    }
    .s-icon { font-size: 20px; width: 26px; text-align: center; flex-shrink: 0; }

    /* ─── Main ────────────────────────────────────── */
    .main {
      flex: 1;
      padding-bottom: calc(var(--nav-h) + 8px);
      min-width: 0;
    }

    /* ─── Top Bar ─────────────────────────────────── */
    .topbar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      position: sticky; top: 0; z-index: 100;
    }
    .topbar-inner {
      max-width: 920px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .page-title { font-size: 18px; font-weight: 700; }
    .month-row {
      display: flex; align-items: center; gap: 6px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 10px; font-size: 14px;
    }
    .month-row select {
      border: none; background: transparent;
      font-size: 13px; color: var(--text); cursor: pointer;
      font-family: inherit;
    }

    /* ─── Pages ───────────────────────────────────── */
    .page { display: none; padding: 16px; max-width: 920px; margin: 0 auto; }
    .page.active { display: block; }

    /* ─── Cards ───────────────────────────────────── */
    .card {
      background: var(--card); border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 18px; margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
    }
    .card-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: var(--text); }

    /* ─── Balance Hero ────────────────────────────── */
    .hero {
      background: linear-gradient(135deg, #1565C0 0%, #0D47A1 100%);
      border-radius: 18px; padding: 26px 20px; color: #fff;
      margin-bottom: 14px; text-align: center;
      box-shadow: 0 4px 16px rgba(21,101,192,.3);
    }
    .hero-label  { font-size: 13px; opacity: .8; margin-bottom: 4px; }
    .hero-amount { font-size: 38px; font-weight: 700; letter-spacing: -.5px; margin-bottom: 6px; }
    .hero-sub    { font-size: 13px; opacity: .75; }
    .hero-sub span { background: rgba(255,255,255,.15); border-radius: 100px; padding: 2px 10px; }

    /* ─── Metrics Grid ────────────────────────────── */
    .metrics { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 14px; }
    .metric {
      background: var(--card); border-radius: var(--radius);
      border: 1px solid var(--border); padding: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
    }
    .metric-lbl { font-size: 12px; color: var(--text-muted); margin-bottom: 3px; }
    .metric-val { font-size: 19px; font-weight: 700; }
    .c-income  { color: var(--success); }
    .c-expense { color: var(--danger); }
    .c-primary { color: var(--primary); }
    .c-purple  { color: var(--purple); }

    /* ─── Charts row ──────────────────────────────── */
    .charts-row { display: grid; gap: 14px; margin-bottom: 14px; }
    .chart-wrap { position: relative; height: 200px; }

    /* ─── Forms ───────────────────────────────────── */
    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block; font-size: 13px; font-weight: 600;
      color: var(--text-muted); margin-bottom: 5px;
    }
    .form-ctrl {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid var(--border); border-radius: 9px;
      font-size: 15px; font-family: inherit; color: var(--text);
      background: var(--card); transition: border-color .2s;
    }
    .form-ctrl:focus { outline: none; border-color: var(--primary); }

    /* ─── Type Toggle ─────────────────────────────── */
    .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .type-btn {
      padding: 12px; border: 2px solid var(--border);
      border-radius: 10px; background: var(--card);
      font-size: 15px; font-family: inherit;
      cursor: pointer; transition: all .2s; font-weight: 600;
    }
    .type-btn.expense.on { border-color: var(--danger);  background: var(--danger-light);  color: var(--danger); }
    .type-btn.income.on  { border-color: var(--success); background: var(--success-light); color: var(--success); }

    /* ─── Buttons ─────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; padding: 11px 18px; border-radius: 10px;
      font-size: 15px; font-family: inherit; font-weight: 600;
      cursor: pointer; border: none; transition: filter .15s;
    }
    .btn:hover { filter: brightness(.92); }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger  { background: var(--danger);  color: #fff; }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text-muted); }
    .btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 7px; }
    .btn-ghost-danger { background: var(--danger-light); color: var(--danger); border: none; }
    .btn-ghost-success { background: var(--success-light); color: var(--success); border: none; }

    /* ─── Transaction Item ────────────────────────── */
    .tx-list { display: flex; flex-direction: column; gap: 8px; }
    .tx-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; background: var(--bg);
      border-radius: 10px; border: 1px solid var(--border);
    }
    .tx-ico {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .tx-info { flex: 1; min-width: 0; }
    .tx-name {
      font-weight: 600; font-size: 14px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tx-date { font-size: 12px; color: var(--text-muted); }
    .tx-right { text-align: right; flex-shrink: 0; }
    .tx-amount { font-weight: 700; font-size: 15px; }

    /* ─── Filter Bar ──────────────────────────────── */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .filter-bar select {
      padding: 8px 10px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 13px; font-family: inherit;
      background: var(--card); color: var(--text); flex: 1; min-width: 90px;
    }

    /* ─── Progress Bar ────────────────────────────── */
    .pb-track {
      background: var(--bg); border-radius: 100px;
      height: 9px; overflow: hidden; margin: 7px 0;
    }
    .pb-fill { height: 100%; border-radius: 100px; transition: width .5s ease; }

    /* ─── Goal Card ───────────────────────────────── */
    .goal-card, .budget-card {
      background: var(--bg); border-radius: 12px;
      border: 1px solid var(--border); padding: 15px; margin-bottom: 10px;
    }
    .goal-hdr { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .goal-name { font-weight: 700; font-size: 15px; }
    .goal-deadline { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .goal-btns { display: flex; gap: 5px; flex-shrink: 0; }
    .goal-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-top: 5px; }

    /* ─── Budget Card ─────────────────────────────── */
    .budget-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .budget-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .status-pill {
      display: inline-block; padding: 2px 9px;
      border-radius: 100px; font-size: 11px; font-weight: 700; margin-top: 2px;
    }
    .pill-ok   { background: var(--success-light); color: var(--success); }
    .pill-warn { background: var(--warning-light); color: var(--warning); }
    .pill-over { background: var(--danger-light);  color: var(--danger); }

    /* ─── Bottom Nav (mobile) ─────────────────────── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--card); border-top: 1px solid var(--border);
      display: flex; height: var(--nav-h); z-index: 200;
      box-shadow: 0 -2px 10px rgba(0,0,0,.07);
    }
    .bn-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
      cursor: pointer; color: var(--text-muted); font-size: 11px;
      border: none; background: none; font-family: inherit; padding: 6px 4px;
      transition: color .2s;
    }
    .bn-item.active { color: var(--primary); }
    .bn-ico { font-size: 22px; line-height: 1; }

    /* ─── Toast ───────────────────────────────────── */
    #toasts {
      position: fixed; top: 16px; right: 16px;
      z-index: 9999; display: flex; flex-direction: column; gap: 8px;
    }
    .toast {
      background: #222; color: #fff;
      padding: 11px 18px; border-radius: 10px;
      font-size: 14px; max-width: 300px;
      box-shadow: 0 4px 14px rgba(0,0,0,.2);
      animation: tIn .25s ease;
    }
    .toast.ok  { background: var(--success); }
    .toast.err { background: var(--danger); }
    @keyframes tIn { from { transform: translateX(110%); opacity: 0; } to { transform: none; opacity: 1; } }

    /* ─── Loading / Empty ─────────────────────────── */
    .loading {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 48px 20px;
      color: var(--text-muted); gap: 12px;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border); border-top-color: var(--primary);
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty {
      text-align: center; padding: 40px 16px;
      color: var(--text-muted);
    }
    .empty-ico { font-size: 46px; margin-bottom: 10px; }

    /* ─── Modal ───────────────────────────────────── */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.5); z-index: 500;
      align-items: flex-end; justify-content: center;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--card); border-radius: 20px 20px 0 0;
      padding: 24px 18px 32px; width: 100%; max-width: 520px;
      max-height: 85vh; overflow-y: auto;
      animation: mUp .28s ease;
    }
    @keyframes mUp { from { transform: translateY(100%); } to { transform: none; } }
    .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 18px; }
    .modal-btns { display: flex; gap: 8px; margin-top: 4px; }
    .modal-btns .btn { flex: 1; }

    /* ─── Summary Row ─────────────────────────────── */
    .sum-row {
      display: flex; justify-content: space-between;
      background: var(--card); border-radius: 10px;
      border: 1px solid var(--border); padding: 12px 16px; margin-bottom: 12px;
    }

    /* ─── Responsive ──────────────────────────────── */
    @media (min-width: 768px) {
      .sidebar { display: flex; }
      .main { margin-left: var(--sidebar-w); padding-bottom: 24px; }
      .bottom-nav { display: none; }
      .metrics { grid-template-columns: repeat(4, 1fr); }
      .charts-row { grid-template-columns: 1fr 1fr; }
      .modal { border-radius: 16px; margin-bottom: 48px; }
    }
    @media (max-width: 767px) {
      .page { padding: 12px 12px 0; }
      .hero-amount { font-size: 32px; }
    }
  </style>
</head>

<body>
<div class="app">

  <!-- ─── Sidebar ─────────────────────────────────── -->
  <nav class="sidebar">
    <div class="sidebar-logo">💰 บันทึกการเงิน</div>
    <div class="sidebar-nav">
      <button class="s-item active" data-p="dashboard" onclick="go('dashboard')"><span class="s-icon">📊</span>แดชบอร์ด</button>
      <button class="s-item" data-p="add"       onclick="go('add')">      <span class="s-icon">➕</span>บันทึกรายการ</button>
      <button class="s-item" data-p="history"   onclick="go('history')">  <span class="s-icon">📋</span>ประวัติรายการ</button>
      <button class="s-item" data-p="goals"     onclick="go('goals')">    <span class="s-icon">🎯</span>เป้าหมายออม</button>
      <button class="s-item" data-p="budget"    onclick="go('budget')">   <span class="s-icon">💼</span>งบประมาณ</button>
    </div>
  </nav>

  <!-- ─── Main ─────────────────────────────────────── -->
  <div class="main">

    <!-- Top Bar -->
    <div class="topbar">
      <div class="topbar-inner">
        <div class="page-title" id="pTitle">แดชบอร์ด</div>
        <div class="month-row">
          🗓️
          <select id="mSel" onchange="onPeriod()"></select>
          <select id="ySel" onchange="onPeriod()"></select>
        </div>
      </div>
    </div>

    <!-- Dashboard -->
    <div class="page active" id="page-dashboard">
      <div id="dashWrap"><div class="loading"><div class="spinner"></div>กำลังโหลด...</div></div>
    </div>

    <!-- Add Transaction -->
    <div class="page" id="page-add">
      <div class="card">
        <div class="card-title">✏️ บันทึกรายการใหม่</div>
        <div class="type-toggle">
          <button class="type-btn expense on" id="btnExp" onclick="setTxType('expense')">💸 รายจ่าย</button>
          <button class="type-btn income"     id="btnInc" onclick="setTxType('income')">💰 รายรับ</button>
        </div>
        <div class="form-group">
          <label class="form-label">หมวดหมู่</label>
          <select class="form-ctrl" id="txCat"><option value="">-- เลือกหมวดหมู่ --</option></select>
        </div>
        <div class="form-group">
          <label class="form-label">รายละเอียด <span style="font-weight:400;opacity:.6">(ไม่บังคับ)</span></label>
          <input class="form-ctrl" type="text" id="txDesc" placeholder="เช่น ข้าวกลางวัน, ค่าน้ำมัน">
        </div>
        <div class="form-group">
          <label class="form-label">จำนวนเงิน (บาท)</label>
          <input class="form-ctrl" type="number" id="txAmt" placeholder="0.00" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label class="form-label">วันที่</label>
          <input class="form-ctrl" type="date" id="txDate">
        </div>
        <button class="btn btn-primary" onclick="saveTx()">💾 บันทึกรายการ</button>
      </div>
    </div>

    <!-- History -->
    <div class="page" id="page-history">
      <div class="filter-bar">
        <select id="fMon" onchange="loadHistory()"><option value="">ทุกเดือน</option></select>
        <select id="fType" onchange="loadHistory()">
          <option value="">ทุกประเภท</option>
          <option value="income">รายรับ</option>
          <option value="expense">รายจ่าย</option>
        </select>
        <select id="fCat" onchange="loadHistory()"><option value="">ทุกหมวด</option></select>
      </div>
      <div id="histWrap"><div class="loading"><div class="spinner"></div>กำลังโหลด...</div></div>
    </div>

    <!-- Goals -->
    <div class="page" id="page-goals">
      <button class="btn btn-primary" style="margin-bottom:14px" onclick="openGoalModal()">➕ เพิ่มเป้าหมายใหม่</button>
      <div id="goalsWrap"><div class="loading"><div class="spinner"></div>กำลังโหลด...</div></div>
    </div>

    <!-- Budget -->
    <div class="page" id="page-budget">
      <button class="btn btn-primary" style="margin-bottom:14px" onclick="openBudgetModal()">➕ ตั้งงบประมาณ</button>
      <div id="budgetWrap"><div class="loading"><div class="spinner"></div>กำลังโหลด...</div></div>
    </div>

  </div><!-- /main -->

  <!-- ─── Bottom Nav ───────────────────────────────── -->
  <nav class="bottom-nav">
    <button class="bn-item active" data-p="dashboard" onclick="go('dashboard')"><span class="bn-ico">📊</span>แดชบอร์ด</button>
    <button class="bn-item" data-p="add"       onclick="go('add')">     <span class="bn-ico">➕</span>บันทึก</button>
    <button class="bn-item" data-p="history"   onclick="go('history')"> <span class="bn-ico">📋</span>ประวัติ</button>
    <button class="bn-item" data-p="goals"     onclick="go('goals')">   <span class="bn-ico">🎯</span>เป้าหมาย</button>
    <button class="bn-item" data-p="budget"    onclick="go('budget')">  <span class="bn-ico">💼</span>งบประมาณ</button>
  </nav>

</div><!-- /app -->

<!-- ─── Toasts ───────────────────────────────────────── -->
<div id="toasts"></div>

<!-- ─── Modal: Add Goal ─────────────────────────────── -->
<div class="overlay" id="mGoal">
  <div class="modal">
    <div class="modal-title">🎯 เพิ่มเป้าหมายการออม</div>
    <div class="form-group">
      <label class="form-label">ชื่อเป้าหมาย</label>
      <input class="form-ctrl" type="text" id="gName" placeholder="เช่น ซื้อรถ, ท่องเที่ยวญี่ปุ่น">
    </div>
    <div class="form-group">
      <label class="form-label">ยอดเป้าหมาย (บาท)</label>
      <input class="form-ctrl" type="number" id="gTarget" placeholder="0">
    </div>
    <div class="form-group">
      <label class="form-label">กำหนดเวลา</label>
      <input class="form-ctrl" type="date" id="gDeadline">
    </div>
    <div class="form-group">
      <label class="form-label">สีธีม</label>
      <input class="form-ctrl" type="color" id="gColor" value="#4CAF50" style="height:44px;cursor:pointer">
    </div>
    <div class="modal-btns">
      <button class="btn btn-primary"  onclick="saveGoal()">✓ บันทึก</button>
      <button class="btn btn-outline"  onclick="closeOverlay('mGoal')">ยกเลิก</button>
    </div>
  </div>
</div>

<!-- ─── Modal: Update Goal Amount ───────────────────── -->
<div class="overlay" id="mGoalAmt">
  <div class="modal">
    <div class="modal-title">💰 อัปเดตยอดออม</div>
    <input type="hidden" id="gAmtId">
    <div class="form-group">
      <label class="form-label">ยอดที่ออมได้ปัจจุบัน (บาท)</label>
      <input class="form-ctrl" type="number" id="gAmtVal" placeholder="0">
    </div>
    <div class="modal-btns">
      <button class="btn btn-primary" onclick="saveGoalAmt()">✓ บันทึก</button>
      <button class="btn btn-outline" onclick="closeOverlay('mGoalAmt')">ยกเลิก</button>
    </div>
  </div>
</div>

<!-- ─── Modal: Budget ───────────────────────────────── -->
<div class="overlay" id="mBudget">
  <div class="modal">
    <div class="modal-title">💼 ตั้งงบประมาณรายหมวด</div>
    <div class="form-group">
      <label class="form-label">หมวดหมู่</label>
      <select class="form-ctrl" id="bCat"><option value="">-- เลือกหมวดหมู่ (รายจ่าย) --</option></select>
    </div>
    <div class="form-group">
      <label class="form-label">วงเงินสูงสุดต่อเดือน (บาท)</label>
      <input class="form-ctrl" type="number" id="bLimit" placeholder="0">
    </div>
    <div class="modal-btns">
      <button class="btn btn-primary" onclick="saveBudget()">✓ บันทึก</button>
      <button class="btn btn-outline" onclick="closeOverlay('mBudget')">ยกเลิก</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════
     JAVASCRIPT
═══════════════════════════════════════════════════ -->
<script>
// ────────────────────────────────────────────────────
//  ⚙️  CONFIG  — วางURL ของ Google Apps Script ตรงนี้
//  ตัวอย่าง: 'https://script.google.com/macros/s/AKfy.../exec'
// ────────────────────────────────────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxnGeY1TJLXu52zj6FAomgCjlVLbLaTo62hFwqQ7ZqHlUV8U6UVZZJcTCE3tZKTkH1_/exec';

// ── State ────────────────────────────────────────────
const S = {
  page:       'dashboard',
  month:      new Date().getMonth() + 1,
  year:       new Date().getFullYear(),
  txType:     'expense',
  categories: [],
  charts:     {}
};

const THAI_MONTHS_FULL  = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const THAI_MONTHS_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const PAGE_TITLES = { dashboard:'แดชบอร์ด', add:'บันทึกรายการ', history:'ประวัติรายการ', goals:'เป้าหมายออม', budget:'งบประมาณ' };

// ── Bootstrap ────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  buildPeriodSelectors();
  document.getElementById('txDate').value = today();
  await loadCategories();
  go('dashboard');
});

function buildPeriodSelectors() {
  const mSel = document.getElementById('mSel');
  THAI_MONTHS_FULL.forEach((m, i) => {
    const o = new Option(m, i + 1);
    if (i + 1 === S.month) o.selected = true;
    mSel.appendChild(o);
  });
  const ySel = document.getElementById('ySel');
  const curY = new Date().getFullYear();
  for (let y = curY; y >= curY - 4; y--) {
    const o = new Option(`${y}`, y);
    if (y === S.year) o.selected = true;
    ySel.appendChild(o);
  }
  // History filter months
  const fMon = document.getElementById('fMon');
  THAI_MONTHS_FULL.forEach((m, i) => fMon.appendChild(new Option(m, i + 1)));
}

function onPeriod() {
  S.month = parseInt(document.getElementById('mSel').value);
  S.year  = parseInt(document.getElementById('ySel').value);
  switch (S.page) {
    case 'dashboard': loadDashboard(); break;
    case 'history':   loadHistory();   break;
    case 'budget':    loadBudget();    break;
  }
}

// ── API ───────────────────────────────────────────────
async function api(params) {
  if (!SCRIPT_URL || SCRIPT_URL === 'YOUR_SCRIPT_URL_HERE') {
    throw new Error('NOT_CONFIGURED');
  }
  const url = SCRIPT_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

// ── Categories ────────────────────────────────────────
async function loadCategories() {
  try {
    S.categories = await api({ action: 'getCategories' });
  } catch (_) {
    S.categories = defaultCats();
  }
  populateCatDropdowns();
}

function defaultCats() {
  return [
    { name:'เงินเดือน',       type:'income',  color:'#4CAF50', icon:'💰' },
    { name:'รายได้เสริม',     type:'income',  color:'#66BB6A', icon:'💵' },
    { name:'โบนัส',           type:'income',  color:'#81C784', icon:'🎁' },
    { name:'ลงทุน',           type:'income',  color:'#26A69A', icon:'📈' },
    { name:'อื่นๆ (รายรับ)',  type:'income',  color:'#78909C', icon:'💱' },
    { name:'อาหาร',           type:'expense', color:'#EF5350', icon:'🍜' },
    { name:'เดินทาง',         type:'expense', color:'#FF7043', icon:'🚗' },
    { name:'ที่พัก',          type:'expense', color:'#FFA726', icon:'🏠' },
    { name:'สุขภาพ',          type:'expense', color:'#EC407A', icon:'💊' },
    { name:'บันเทิง',         type:'expense', color:'#AB47BC', icon:'🎮' },
    { name:'ช้อปปิ้ง',        type:'expense', color:'#7E57C2', icon:'🛍️' },
    { name:'สาธารณูปโภค',     type:'expense', color:'#42A5F5', icon:'⚡' },
    { name:'การศึกษา',        type:'expense', color:'#26C6DA', icon:'📚' },
    { name:'อื่นๆ (รายจ่าย)', type:'expense', color:'#78909C', icon:'📌' },
  ];
}

function catMap() {
  const m = {};
  S.categories.forEach(c => m[c.name] = c);
  return m;
}

function populateCatDropdowns() {
  fillTxCats();
  // History filter
  const fCat = document.getElementById('fCat');
  fCat.innerHTML = '<option value="">ทุกหมวด</option>';
  S.categories.forEach(c => fCat.appendChild(new Option(`${c.icon} ${c.name}`, c.name)));
  // Budget category
  const bCat = document.getElementById('bCat');
  bCat.innerHTML = '<option value="">-- เลือกหมวดหมู่ (รายจ่าย) --</option>';
  S.categories.filter(c => c.type === 'expense').forEach(c =>
    bCat.appendChild(new Option(`${c.icon} ${c.name}`, c.name))
  );
}

function fillTxCats() {
  const sel = document.getElementById('txCat');
  sel.innerHTML = '<option value="">-- เลือกหมวดหมู่ --</option>';
  S.categories.filter(c => c.type === S.txType)
    .forEach(c => sel.appendChild(new Option(`${c.icon} ${c.name}`, c.name)));
}

// ── Navigation ────────────────────────────────────────
function go(page) {
  S.page = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('[data-p]').forEach(el => el.classList.toggle('active', el.dataset.p === page));
  document.getElementById('pTitle').textContent = PAGE_TITLES[page];
  if (page === 'dashboard') loadDashboard();
  if (page === 'history')   loadHistory();
  if (page === 'goals')     loadGoals();
  if (page === 'budget')    loadBudget();
}

// ── Dashboard ─────────────────────────────────────────
async function loadDashboard() {
  const el = document.getElementById('dashWrap');
  el.innerHTML = spinner();
  try {
    const [sum, txs] = await Promise.all([
      api({ action: 'getSummary',      month: S.month, year: S.year }),
      api({ action: 'getTransactions', month: S.month, year: S.year })
    ]);
    renderDashboard(sum, txs.slice(0, 5));
  } catch (e) {
    el.innerHTML = errBox(e.message);
  }
}

function renderDashboard(s, recent) {
  const mn = THAI_MONTHS_SHORT[s.month - 1];
  const balColor = s.balance >= 0 ? '' : 'color:#ffcdd2';

  document.getElementById('dashWrap').innerHTML = `
    <!-- Hero -->
    <div class="hero">
      <div class="hero-label">ยอดคงเหลือเดือน${mn} ${s.year + 543}</div>
      <div class="hero-amount" style="${balColor}">${fmt(s.balance)}</div>
      <div class="hero-sub"><span>💹 อัตราออม ${s.savingsRate}%</span></div>
    </div>

    <!-- Metrics -->
    <div class="metrics">
      <div class="metric"><div class="metric-lbl">💰 รายรับ</div>   <div class="metric-val c-income">${fmt(s.totalIncome)}</div></div>
      <div class="metric"><div class="metric-lbl">💸 รายจ่าย</div>  <div class="metric-val c-expense">${fmt(s.totalExpense)}</div></div>
      <div class="metric"><div class="metric-lbl">🏦 ออมได้</div>   <div class="metric-val c-purple">${fmt(Math.max(0, s.balance))}</div></div>
      <div class="metric"><div class="metric-lbl">📊 % ออม</div>    <div class="metric-val c-primary">${s.savingsRate}%</div></div>
    </div>

    <!-- Charts -->
    <div class="charts-row">
      <div class="card">
        <div class="card-title">📈 รายรับ-รายจ่าย 6 เดือน</div>
        <div class="chart-wrap"><canvas id="cBar"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">🥧 รายจ่ายตามหมวดหมู่</div>
        <div class="chart-wrap" style="height:220px" id="donutWrap">
          <canvas id="cDonut"></canvas>
        </div>
      </div>
    </div>

    <!-- Recent Transactions -->
    <div class="card">
      <div class="card-title">🕐 รายการล่าสุด</div>
      ${recent.length === 0
        ? '<div class="empty"><div class="empty-ico">📭</div>ยังไม่มีรายการเดือนนี้</div>'
        : `<div class="tx-list">${recent.map(t => txItem(t, false)).join('')}</div>
           <div style="text-align:center;margin-top:12px">
             <button class="btn btn-outline btn-sm" onclick="go('history')">ดูทั้งหมด →</button>
           </div>`
      }
    </div>
  `;

  drawBar(s.last6Months);
  drawDonut(s.expenseByCategory);
}

function drawBar(data) {
  const ctx = document.getElementById('cBar');
  if (!ctx) return;
  if (S.charts.bar) S.charts.bar.destroy();
  S.charts.bar = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: data.map(d => d.label),
      datasets: [
        { label: 'รายรับ',  data: data.map(d => d.income),  backgroundColor: 'rgba(46,125,50,.75)',  borderRadius: 5 },
        { label: 'รายจ่าย', data: data.map(d => d.expense), backgroundColor: 'rgba(198,40,40,.75)', borderRadius: 5 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { font: { family: 'Sarabun' }, padding: 10, boxWidth: 12 } } },
      scales: {
        y: { ticks: { callback: v => fmtShort(v), font: { family: 'Sarabun' } }, grid: { color: '#f0f0f0' } },
        x: { ticks: { font: { family: 'Sarabun' } }, grid: { display: false } }
      }
    }
  });
}

function drawDonut(byCat) {
  if (S.charts.donut) { S.charts.donut.destroy(); S.charts.donut = null; }
  const entries = Object.entries(byCat || {}).filter(([,v]) => v > 0);
  if (entries.length === 0) {
    const w = document.getElementById('donutWrap');
    if (w) w.innerHTML = '<div class="empty" style="padding:28px"><div class="empty-ico">📊</div>ยังไม่มีรายจ่าย</div>';
    return;
  }
  const cm = catMap();
  const ctx = document.getElementById('cDonut');
  if (!ctx) return;
  S.charts.donut = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: entries.map(([k]) => k),
      datasets: [{
        data:            entries.map(([,v]) => v),
        backgroundColor: entries.map(([k]) => (cm[k] || { color:'#90A4AE' }).color),
        borderWidth: 2, borderColor: '#fff'
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '62%',
      plugins: {
        legend: { position: 'right', labels: { font: { family: 'Sarabun', size: 11 }, padding: 7, boxWidth: 11 } },
        tooltip: { callbacks: { label: c => ` ${fmt(c.raw)}` } }
      }
    }
  });
}

// ── Add Transaction ───────────────────────────────────
function setTxType(type) {
  S.txType = type;
  document.getElementById('btnExp').classList.toggle('on', type === 'expense');
  document.getElementById('btnInc').classList.toggle('on', type === 'income');
  fillTxCats();
}

async function saveTx() {
  const cat  = document.getElementById('txCat').value;
  const desc = document.getElementById('txDesc').value.trim();
  const amt  = document.getElementById('txAmt').value;
  const date = document.getElementById('txDate').value;
  if (!cat)  return toast('กรุณาเลือกหมวดหมู่', 'err');
  if (!amt || parseFloat(amt) <= 0) return toast('กรุณากรอกจำนวนเงิน', 'err');
  if (!date) return toast('กรุณาเลือกวันที่', 'err');
  try {
    await api({ action:'addTransaction', type: S.txType, category: cat, description: desc, amount: parseFloat(amt), date });
    toast(`บันทึก${S.txType === 'income' ? 'รายรับ' : 'รายจ่าย'}สำเร็จ ✓`, 'ok');
    document.getElementById('txCat').value  = '';
    document.getElementById('txDesc').value = '';
    document.getElementById('txAmt').value  = '';
    document.getElementById('txDate').value = today();
  } catch (e) {
    toast('เกิดข้อผิดพลาด: ' + e.message, 'err');
  }
}

// ── History ───────────────────────────────────────────
async function loadHistory() {
  document.getElementById('histWrap').innerHTML = spinner();
  const params = { action:'getTransactions', year: S.year };
  const m = document.getElementById('fMon').value;
  const t = document.getElementById('fType').value;
  const c = document.getElementById('fCat').value;
  if (m) params.month    = m;
  if (t) params.type     = t;
  if (c) params.category = c;
  try {
    const txs = await api(params);
    renderHistory(txs);
  } catch (e) {
    document.getElementById('histWrap').innerHTML = errBox(e.message);
  }
}

function renderHistory(txs) {
  const el = document.getElementById('histWrap');
  if (txs.length === 0) {
    el.innerHTML = '<div class="empty"><div class="empty-ico">📭</div>ไม่พบรายการ</div>';
    return;
  }
  let inc = 0, exp = 0;
  txs.forEach(t => { if (t.type === 'income') inc += t.amount; else exp += t.amount; });
  el.innerHTML = `
    <div class="sum-row">
      <div><div style="font-size:12px;color:var(--text-muted)">รายรับรวม</div><div style="font-weight:700;color:var(--success)">${fmt(inc)}</div></div>
      <div style="text-align:right"><div style="font-size:12px;color:var(--text-muted)">รายจ่ายรวม</div><div style="font-weight:700;color:var(--danger)">${fmt(exp)}</div></div>
    </div>
    <div class="card"><div class="tx-list">${txs.map(t => txItem(t, true)).join('')}</div></div>
  `;
}

function txItem(t, showDel) {
  const cm  = catMap();
  const cat = cm[t.category] || {};
  const ico = cat.icon  || (t.type === 'income' ? '💰' : '💸');
  const col = cat.color || (t.type === 'income' ? '#4CAF50' : '#EF5350');
  const sign = t.type === 'income' ? '+' : '-';
  return `
    <div class="tx-item" id="tx-${t.id}">
      <div class="tx-ico" style="background:${col}22">${ico}</div>
      <div class="tx-info">
        <div class="tx-name">${t.category}${t.description ? ' · ' + esc(t.description) : ''}</div>
        <div class="tx-date">${fmtDate(t.date)}</div>
      </div>
      <div class="tx-right">
        <div class="tx-amount ${t.type}">${sign}${fmt(t.amount)}</div>
        ${showDel ? `<button class="btn btn-sm btn-ghost-danger" style="margin-top:5px" onclick="deleteTx('${t.id}')">🗑 ลบ</button>` : ''}
      </div>
    </div>`;
}

async function deleteTx(id) {
  if (!confirm('ยืนยันการลบรายการนี้?')) return;
  try {
    await api({ action:'deleteTransaction', id });
    document.getElementById('tx-' + id)?.remove();
    toast('ลบรายการสำเร็จ', 'ok');
  } catch (e) { toast('เกิดข้อผิดพลาด: ' + e.message, 'err'); }
}

// ── Goals ─────────────────────────────────────────────
async function loadGoals() {
  document.getElementById('goalsWrap').innerHTML = spinner();
  try {
    const goals = await api({ action:'getGoals' });
    renderGoals(goals);
  } catch (e) {
    document.getElementById('goalsWrap').innerHTML = errBox(e.message);
  }
}

function renderGoals(goals) {
  const el = document.getElementById('goalsWrap');
  if (goals.length === 0) {
    el.innerHTML = '<div class="empty"><div class="empty-ico">🎯</div>ยังไม่มีเป้าหมาย กดปุ่มด้านบนเพื่อเริ่มต้น</div>';
    return;
  }
  el.innerHTML = goals.map(g => {
    const pct  = g.targetAmount > 0 ? Math.min(100, g.currentAmount / g.targetAmount * 100) : 0;
    const left = Math.max(0, g.targetAmount - g.currentAmount);
    const dStr = g.deadline ? fmtDate(g.deadline) : 'ไม่กำหนด';
    return `
      <div class="goal-card">
        <div class="goal-hdr">
          <div>
            <div class="goal-name">${esc(g.name)}</div>
            <div class="goal-deadline">📅 กำหนด ${dStr}</div>
          </div>
          <div class="goal-btns">
            <button class="btn btn-sm btn-ghost-success" onclick="openGoalAmt('${g.id}',${g.currentAmount})">อัปเดต</button>
            <button class="btn btn-sm btn-ghost-danger"  onclick="rmGoal('${g.id}')">ลบ</button>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:13px">${fmt(g.currentAmount)} / ${fmt(g.targetAmount)}</span>
          <span style="font-weight:800;color:${g.color}">${pct.toFixed(1)}%</span>
        </div>
        <div class="pb-track"><div class="pb-fill" style="width:${pct}%;background:${g.color}"></div></div>
        <div class="goal-meta">
          <span>ออมแล้ว ${fmt(g.currentAmount)}</span>
          <span>เหลืออีก ${fmt(left)}</span>
        </div>
      </div>`;
  }).join('');
}

function openGoalModal() {
  ['gName','gTarget'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('gDeadline').value = '';
  document.getElementById('gColor').value    = '#4CAF50';
  openOverlay('mGoal');
}

function openGoalAmt(id, cur) {
  document.getElementById('gAmtId').value  = id;
  document.getElementById('gAmtVal').value = cur;
  openOverlay('mGoalAmt');
}

async function saveGoal() {
  const name   = document.getElementById('gName').value.trim();
  const target = document.getElementById('gTarget').value;
  const dead   = document.getElementById('gDeadline').value;
  const color  = document.getElementById('gColor').value;
  if (!name)                          return toast('กรุณากรอกชื่อเป้าหมาย', 'err');
  if (!target || parseFloat(target) <= 0) return toast('กรุณากรอกยอดเป้าหมาย', 'err');
  try {
    await api({ action:'addGoal', name, targetAmount: parseFloat(target), deadline: dead, color });
    toast('เพิ่มเป้าหมายสำเร็จ ✓', 'ok');
    closeOverlay('mGoal');
    loadGoals();
  } catch (e) { toast('เกิดข้อผิดพลาด: ' + e.message, 'err'); }
}

async function saveGoalAmt() {
  const id  = document.getElementById('gAmtId').value;
  const amt = document.getElementById('gAmtVal').value;
  if (!amt) return toast('กรุณากรอกยอดออม', 'err');
  try {
    await api({ action:'updateGoalAmount', id, amount: parseFloat(amt) });
    toast('อัปเดตยอดออมสำเร็จ ✓', 'ok');
    closeOverlay('mGoalAmt');
    loadGoals();
  } catch (e) { toast('เกิดข้อผิดพลาด: ' + e.message, 'err'); }
}

async function rmGoal(id) {
  if (!confirm('ยืนยันการลบเป้าหมายนี้?')) return;
  try {
    await api({ action:'deleteGoal', id });
    toast('ลบเป้าหมายสำเร็จ', 'ok');
    loadGoals();
  } catch (e) { toast('เกิดข้อผิดพลาด: ' + e.message, 'err'); }
}

// ── Budget ────────────────────────────────────────────
async function loadBudget() {
  document.getElementById('budgetWrap').innerHTML = spinner();
  try {
    const [budgets, txs] = await Promise.all([
      api({ action:'getBudgets',      month: S.month, year: S.year }),
      api({ action:'getTransactions', month: S.month, year: S.year, type:'expense' })
    ]);
    const spent = {};
    txs.forEach(t => { spent[t.category] = (spent[t.category] || 0) + t.amount; });
    renderBudget(budgets, spent);
  } catch (e) {
    document.getElementById('budgetWrap').innerHTML = errBox(e.message);
  }
}

function renderBudget(budgets, spent) {
  const el = document.getElementById('budgetWrap');
  if (budgets.length === 0) {
    el.innerHTML = '<div class="empty"><div class="empty-ico">💼</div>ยังไม่มีงบประมาณ กดปุ่มด้านบนเพื่อตั้งค่า</div>';
    return;
  }
  const cm = catMap();
  el.innerHTML = `
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:10px">
      📅 งบประมาณ${THAI_MONTHS_FULL[S.month-1]} ${S.year + 543}
    </div>` +
  budgets.map(b => {
    const used  = spent[b.category] || 0;
    const pct   = b.monthlyLimit > 0 ? Math.min(100, used / b.monthlyLimit * 100) : 0;
    const left  = Math.max(0, b.monthlyLimit - used);
    const over  = used > b.monthlyLimit;
    const warn  = pct >= 80 && !over;
    const color = over ? 'var(--danger)' : warn ? 'var(--warning)' : 'var(--success)';
    const pill  = over ? '<span class="status-pill pill-over">⚠ เกินงบ</span>'
                       : warn ? '<span class="status-pill pill-warn">⚡ ใกล้เต็ม</span>'
                               : '<span class="status-pill pill-ok">✓ ปกติ</span>';
    const cat = cm[b.category] || {};
    return `
      <div class="budget-card">
        <div class="budget-hdr">
          <div>
            <div style="font-weight:700;font-size:15px">${cat.icon||'📌'} ${b.category}</div>
            ${pill}
          </div>
          <div style="font-size:22px;font-weight:800;color:${color}">${pct.toFixed(0)}%</div>
        </div>
        <div class="pb-track"><div class="pb-fill" style="width:${pct}%;background:${color}"></div></div>
        <div class="budget-meta">
          <span>ใช้ไป ${fmt(used)}</span>
          <span>งบ ${fmt(b.monthlyLimit)}</span>
        </div>
        <div style="font-size:12px;margin-top:4px;color:${over ? 'var(--danger)' : 'var(--text-muted)'}">
          ${over ? `⚠ เกินงบ ${fmt(used - b.monthlyLimit)}` : `เหลือ ${fmt(left)}`}
        </div>
      </div>`;
  }).join('');
}

function openBudgetModal() {
  document.getElementById('bCat').value   = '';
  document.getElementById('bLimit').value = '';
  openOverlay('mBudget');
}

async function saveBudget() {
  const cat   = document.getElementById('bCat').value;
  const limit = document.getElementById('bLimit').value;
  if (!cat)  return toast('กรุณาเลือกหมวดหมู่', 'err');
  if (!limit || parseFloat(limit) <= 0) return toast('กรุณากรอกวงเงิน', 'err');
  try {
    await api({ action:'setBudget', category: cat, monthlyLimit: parseFloat(limit), month: S.month, year: S.year });
    toast('ตั้งงบประมาณสำเร็จ ✓', 'ok');
    closeOverlay('mBudget');
    loadBudget();
  } catch (e) { toast('เกิดข้อผิดพลาด: ' + e.message, 'err'); }
}

// ── Overlay helpers ───────────────────────────────────
function openOverlay(id)  { document.getElementById(id).classList.add('open'); }
function closeOverlay(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.overlay').forEach(ov =>
  ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('open'); })
);

// ── Utilities ─────────────────────────────────────────
function fmt(n) {
  return (parseFloat(n) || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ฿';
}
function fmtShort(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
  return n;
}
function fmtDate(v) {
  if (!v) return '-';
  const d = new Date(v);
  if (isNaN(d)) return v;
  return `${d.getDate()} ${THAI_MONTHS_SHORT[d.getMonth()]} ${d.getFullYear() + 543}`;
}
function today() { return new Date().toISOString().split('T')[0]; }
function esc(s)  { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toast(msg, type = '') {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

function spinner() {
  return '<div class="loading"><div class="spinner"></div>กำลังโหลดข้อมูล...</div>';
}

function errBox(msg) {
  if (msg === 'NOT_CONFIGURED') return `
    <div class="card" style="border:2px dashed var(--warning);text-align:center;padding:32px">
      <div style="font-size:40px;margin-bottom:10px">⚙️</div>
      <div style="font-weight:700;font-size:16px;margin-bottom:8px">ยังไม่ได้ตั้งค่า Script URL</div>
      <div style="font-size:13px;color:var(--text-muted);line-height:1.7">
        กรุณาทำตามคู่มือ setup-guide.md<br>
        แล้วแทนที่ <code>YOUR_SCRIPT_URL_HERE</code><br>
        ด้วย URL ของ Google Apps Script
      </div>
    </div>`;
  return `<div class="card" style="text-align:center;padding:32px">
    <div style="font-size:36px;margin-bottom:10px">❌</div>
    <div style="color:var(--danger);font-size:14px">${esc(msg)}</div>
  </div>`;
}
</script>
